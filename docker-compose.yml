# =============================================================================
# docker-compose.yml — CRM Microservices (architecture complète)
# -----------------------------------------------------------------------------
# Démarre toute l'architecture Spring Cloud :
#   MySQL 8           -> base de données unique
#   discovery-service -> serveur Eureka (port 8761)
#   gateway-service   -> Spring Cloud Gateway (port 8080)
#   identity-service  -> authentification JWT (port 8082)
#   employee / department / customer / hr / payroll / fees / invoice
#                       -> microservices métier (ports 8083-8089)
#
# Le monolithe backend/ et la librairie common-security NE sont PAS inclus.
#
# Le fichier est compatible avec Docker Compose v2.
#   docker compose config
#   docker compose up --build
#   docker compose ps
#   docker compose logs -f
#   docker compose down
# =============================================================================

# -----------------------------------------------------------------------------
# Volumes nommés (persistance MySQL)
# -----------------------------------------------------------------------------
volumes:
  mysql-data:
    # Les données MySQL survivent à « docker compose down ».
    # Seul « docker compose down -v » les supprime.

# -----------------------------------------------------------------------------
# Réseau Docker unique
# -----------------------------------------------------------------------------
networks:
  crm-network:
    driver: bridge
    # Tous les conteneurs du projet communiquent par leur nom de service
    # sur ce réseau privé de type bridge.

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
services:

  # ===========================================================================
  # 1. MySQL 8.0 — base de données unique pour tous les microservices
  # ===========================================================================
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: Root123@
      MYSQL_DATABASE: crm_db
      MYSQL_ROOT_HOST: '%'
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_0900_ai_ci
      TZ: Europe/Paris

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - crm-network

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 2. Discovery Service — serveur Eureka (port 8761)
  # ===========================================================================
  discovery-service:
    build:
      context: ./microservices/discovery-service
      dockerfile: Dockerfile
    image: crm/discovery-service:latest
    restart: unless-stopped
    ports:
      - "8761:8761"
    networks:
      - crm-network

  # ===========================================================================
  # 3. Gateway Service — Spring Cloud Gateway (port 8080)
  # ===========================================================================
  gateway-service:
    build:
      context: ./microservices/gateway-service
      dockerfile: Dockerfile
    image: crm/gateway-service:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Redirige Eureka vers le conteneur discovery-service (au lieu de localhost)
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      discovery-service:
        condition: service_started
    networks:
      - crm-network

  # ===========================================================================
  # 4. Identity Service — authentification JWT (port 8082)
  # ===========================================================================
  identity-service:
    build:
      context: ./microservices/identity-service
      dockerfile: Dockerfile
    image: crm/identity-service:latest
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/identity_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Root123@
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
    depends_on:
      discovery-service:
        condition: service_started
      mysql:
        condition: service_healthy
    networks:
      - crm-network

  # ===========================================================================
  # 5. Employee Service (port 8083)
  # ===========================================================================
  employee-service:
