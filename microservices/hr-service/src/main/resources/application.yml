server:
  port: 8086

spring:
  application:
    name: hr-service
  datasource:
    url: jdbc:mysql://localhost:3307/hr_db
    username: root
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  security:
    account-validation:
      base-url: ${IDENTITY_VALIDATION_BASE_URL}
      connect-timeout: 500ms
      read-timeout: 1s
      total-timeout: 1500ms
  jwt:
    secret: ${APP_JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

info:
  app:
    name: hr-service
    description: HR microservice
    version: 0.0.1-SNAPSHOT
