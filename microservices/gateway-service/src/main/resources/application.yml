server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-test
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/identity/api/test
          filters:
            - StripPrefix=1
        - id: employee-test
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/employee/api/test
          filters:
            - StripPrefix=1
        - id: employee-service
          uri: lb://EMPLOYEE-SERVICE
          predicates:
            - Path=/employee/api/employees/**
          filters:
            - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: '*'
