server:
  port: 8080

spring:
  application:
    name: gateway-service

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: identity-test
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/identity/api/test

management:
  endpoints:
    web:
      exposure:
        include: '*'



