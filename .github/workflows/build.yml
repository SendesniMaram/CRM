name: SonarQube Microservices

on:
  push:
    branches:
      - main
      - microservices
      - publication-clean

  pull_request:
    branches: [main, microservices, publication-clean]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    name: Build and analyze ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - gateway-service
          - identity-service
          - employee-service
          - department-service
          - customer-service
          - hr-service
          - payroll-service
          - fees-service
          - invoice-service

    defaults:
      run:
        working-directory: microservices/${{ matrix.service }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('microservices/{0}/pom.xml', matrix.service)) }}
          restore-keys: ${{ runner.os }}-m2

      # Install the shared Maven module com.crm:common-security into the
      # runner's local Maven repository (~/.m2) BEFORE building any service
      # that depends on it. Without this step, the dependent services fail
      # with "Could not find artifact com.crm:common-security:jar:0.0.1-SNAPSHOT".
      # Only the 7 services that declare the dependency need this step.
      - name: Install common-security to local Maven repository
        if: contains(fromJson('["employee-service","department-service","customer-service","hr-service","payroll-service","fees-service","invoice-service"]'), matrix.service)
        run: mvn -B -q -f ../common-security/pom.xml clean install -DskipTests

      - name: Build, test and generate coverage
        run: |
          mvn -B org.jacoco:jacoco-maven-plugin:0.8.15:prepare-agent \
            verify org.jacoco:jacoco-maven-plugin:0.8.15:report
          test -s target/site/jacoco/jacoco.xml

      - name: Analyze existing Sonar project and wait for its Quality Gate
        # Fork/Dependabot PRs run tests above without receiving Sonar credentials.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Preserve the existing SonarQube Cloud destination by default.
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
        run: |
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo '::error::Repository secret SONAR_TOKEN is required for the existing Sonar integration.'
            exit 1
          fi
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.organization=sendesnimaram \
            -Dsonar.projectKey=SendesniMaram_CRM_${{ matrix.service }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  # ---------------------------------------------------------------------------
  # Job dédié au module Maven partagé com.crm:common-security.
  # Indépendant du job "build" : il exécute pour de vrai les tests JUnit du
  # module (5 tests dans JwtServiceTest), ce que le job "build" ne fait pas
  # car il installe common-security avec -DskipTests.
  # ---------------------------------------------------------------------------
  common-security:
    name: common-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/common-security

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-common-security-${{ hashFiles('microservices/common-security/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test common-security
        run: mvn -B verify

  # ---------------------------------------------------------------------------
  # Job dédié au monolithe backend (Spring Boot 3.5.16, Java 21).
  # Indépendant du job "build" : compile et exécute les tests du backend
  # (CrmApplicationTests, SwaggerEndpointsTest, UserMapperTest, JwtServiceTest).
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Backend tests use H2 in memory; no MySQL credentials are required.

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-backend-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test backend
        run: mvn -B verify
