name: SonarQube Microservices

on:
  push:
    branches:
      - main
      - microservices

  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - gateway-service
          - identity-service
          - employee-service
          - department-service
          - customer-service
          - hr-service
          - payroll-service
          - fees-service
          - invoice-service

    defaults:
      run:
        working-directory: microservices/${{ matrix.service }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles(format('microservices/{0}/pom.xml', matrix.service)) }}
          restore-keys: ${{ runner.os }}-m2

      # Install the shared Maven module com.crm:common-security into the
      # runner's local Maven repository (~/.m2) BEFORE building any service
      # that depends on it. Without this step, the dependent services fail
      # with "Could not find artifact com.crm:common-security:jar:0.0.1-SNAPSHOT".
      # Only the 7 services that declare the dependency need this step.
      - name: Install common-security to local Maven repository
        if: contains(fromJson('["employee-service","department-service","customer-service","hr-service","payroll-service","fees-service","invoice-service"]'), matrix.service)
        run: cd ../common-security ; mvn -B -q clean install -DskipTests

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=sendesnimaram
          -Dsonar.projectKey=SendesniMaram_CRM_${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # Job dédié au module Maven partagé com.crm:common-security.
  # Indépendant du job "build" : il exécute pour de vrai les tests JUnit du
  # module (5 tests dans JwtServiceTest), ce que le job "build" ne fait pas
  # car il installe common-security avec -DskipTests.
  # ---------------------------------------------------------------------------
  common-security:
    name: common-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/common-security

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-common-security-${{ hashFiles('microservices/common-security/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test common-security
        run: mvn -B verify

  # ---------------------------------------------------------------------------
  # Job dédié au monolithe backend (Spring Boot 3.5.16, Java 21).
  # Indépendant du job "build" : compile et exécute les tests du backend
  # (CrmApplicationTests, SwaggerEndpointsTest, UserMapperTest, JwtServiceTest).
  # ---------------------------------------------------------------------------
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # MySQL 8.0 est requis par les tests @SpringBootTest du backend
      # (jdbc:mysql://localhost:3306/crm_db, root / Root123@).
      # MYSQL_ROOT_HOST='%' autorise les connexions root du runner
      # (l'IP source vue depuis le conteneur est '%' côté Docker bridge),
      # indispensable pour Hibernate (ddl-auto=update) et le DataInitializer.
      # Le healthcheck (mysqladmin ping) fait attendre GitHub Actions jusqu'à
      # ce que MySQL soit réellement prêt avant d'exécuter les steps.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Root123@
          MYSQL_DATABASE: crm_db
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pRoot123@ --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          java-version: 21
          distribution: zulu

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-backend-${{ hashFiles('backend/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and test backend
        run: mvn -B verify
